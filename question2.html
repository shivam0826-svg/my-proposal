<!DOCTYPE html>
<html lang="en">

<head>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="page">

        <div class="progress">

            <span class="active"></span>

            <span></span>

        <div class="card question-card">

            <p class="page-number">02 / 03</p>

            <div class="question-icon">✨</div>

            <h1>Okay… one little thought.</h1>

            <p class="question">
                Do you believe that sometimes,
                <br>

                <br>

            </p>

            <div class="options">

                <button onclick="selectOption(this)">

                <button onclick="selectOption(this)">
                    🤔 Maybe

                <button onclick="selectOption(this)">
                    🌸 Never thought about it

            </div>

            <div class="custom-answer">

                <p>
                    Or tell me what you think…
                </p>

                <textarea
                    id="answer2"
                    placeholder="Your thoughts..."></textarea>

            </div>

            <a href="shayari.html" class="btn">
                Continue ✨
            </a>

            <p class="bottom-note">
                Take your time. There's no wrong answer. ❤️
            </p>
